variables:
  IMAGE_TAG: "$CI_REGISTRY/$CI_PROJECT_PATH:$CI_COMMIT_SHORT_SHA"
  TRIVY_SEVERITY: "CRITICAL,HIGH"

stages:
  - build
  - scan
  - push

build-image:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -t "$IMAGE_TAG" -f app/Dockerfile app/
    - docker save "$IMAGE_TAG" -o image.tar
  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour

trivy-image-scan:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy image --input image.tar --severity "$TRIVY_SEVERITY" --exit-code 1 --format table
    - trivy image --input image.tar --format json --output trivy-report.json
  artifacts:
    paths:
      - trivy-report.json
    when: always
    expire_in: 30 days
  allow_failure: false

safety-scan:
  stage: scan
  image: python:3.12-slim
  script:
    - pip install safety
    - safety check -r app/requirements.txt --full-report --output text
  allow_failure: false

push-image:
  stage: push
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker load -i image.tar
    - docker push "$IMAGE_TAG"
  only:
    - main
